# =============================================================================
# SOVRA PRODUCTION NGINX REVERSE PROXY & LOAD BALANCER CONFIGURATION
# High-availability layer decoupling API nodes, WebSocket pool & Validator RPC
# =============================================================================

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format with upstream timing and status
    log_format sovra_upstream '$remote_addr - $remote_user [$time_local] '
                             '"$request" $status $body_bytes_sent '
                             '"$http_referer" "$http_user_agent" '
                             'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time" '
                             'upstream=$upstream_addr';

    access_log /var/log/nginx/access.log sovra_upstream;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Client body buffers
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # Rate limiting zone: 30 requests/second with burst 60
    limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=addr_conn_limit:10m;

    # -------------------------------------------------------------------------
    # Upstream Pool: Horizontally Scaled Decoupled API Nodes
    # -------------------------------------------------------------------------
    upstream sovra_api_cluster {
        least_conn;
        server api-node-1:3001 max_fails=3 fail_timeout=10s;
        server api-node-2:3002 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # -------------------------------------------------------------------------
    # Upstream Pool: High-Availability Validator RPC Nodes
    # -------------------------------------------------------------------------
    upstream sovra_validator_rpc_pool {
        server validator-0:26657 max_fails=2 fail_timeout=5s;
        server validator-1:26667 backup;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        # OWASP Recommended Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss: https:;" always;

        # Health check endpoint for external Load Balancer / Ingress
        location = /health/lb {
            access_log off;
            default_type application/json;
            return 200 '{"status":"UP","load_balancer":"nginx","cluster_healthy":true}';
        }

        # Health checks routed directly to API cluster
        location /health {
            proxy_pass http://sovra_api_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        # WebSocket real-time messaging & WebRTC signaling
        location /ws {
            proxy_pass http://sovra_api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Decoupled Public API Gateway
        location /api/ {
            limit_req zone=api_rate_limit burst=60 nodelay;
            limit_conn addr_conn_limit 20;

            proxy_pass http://sovra_api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 15s;
            proxy_read_timeout 30s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        # Direct Read-Only CometBFT RPC for Blockchain Explorers / Wallets
        location /rpc/ {
            limit_req zone=api_rate_limit burst=20 nodelay;

            rewrite ^/rpc/(.*) /$1 break;
            proxy_pass http://sovra_validator_rpc_pool;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_next_upstream error timeout http_502 http_503;
        }

        # Block direct access to internal clustering routes
        location /internal/ {
            deny all;
            return 403 '{"error":"Forbidden: Internal clustering endpoints are private"}';
        }
    }
}
