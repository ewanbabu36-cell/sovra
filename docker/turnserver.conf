# ============================================================
#   SOVRA PRODUCTION COTURN RELAY CONFIGURATION
#   Secure WebRTC TURN/STUN Server Configuration
# ============================================================

# Network & Listening Ports (UDP, TCP, TLS)
listening-port=3478
tls-listening-port=5349
alt-listening-port=3479
alt-tls-listening-port=5350

# Relay Port Range for UDP Media Traffic (Bound for NAT & Firewall traversal)
min-port=49152
max-port=49200

# WebRTC Protocol Hardening
fingerprint
lt-cred-mech

# Realm definition for authentication (Must match TURN credentials)
realm=sovra.network

# Ephemeral Time-Windowed Authentication (REST API Secret)
# Used when SOVRA_TURN_SECRET or WEBRTC_TURN_SECRET is set for short-lived HMAC-SHA1 tokens
use-auth-secret
static-auth-secret=sovra-dev-turn-secret-change-in-prod-replace-with-env!

# Nonce expiration for replay protection (in seconds)
stale-nonce=600

# Rate & Resource Quota Hardening (Prevents Bandwidth & Memory Exhaustion)
bps-capacity=0
max-bps=3000000
total-quota=200
user-quota=10

# Security Boundaries: Deny relay loops to internal RFC1918 / Cloud Metadata networks
no-loopback-peers
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255

# TLS Ciphers & Cryptography
cipher-list="ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"
ec-curve-name=prime256v1
# cert=/etc/coturn/certs/turn_server_cert.pem
# pkey=/etc/coturn/certs/turn_server_pkey.pem

# External IP Mapping (Override in cloud deployments with actual public IP)
# external-ip=PUBLIC_IP/PRIVATE_IP

# Performance & Logging
verbose
no-cli
log-file=stdout
