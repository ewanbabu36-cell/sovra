# ==============================================================================
# SOVRA DECOUPLED ENTERPRISE ARCHITECTURE (POSTGRESQL + REDIS + MULTI-SERVICE)
# Stateless API Replicas, Distributed Workers, L1 Validators & Autonomous Relayer
# Zero shared SQLite volumes; zero hardcoded secret fallbacks.
# ==============================================================================

networks:
  sovra-mesh:
    driver: bridge

volumes:
  sovra-pg-data:
  sovra-redis-data:
  sovra-val0-data:
  sovra-val1-data:

services:
  # 1. Primary ACID Persistence: Clustered / Persistent PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: sovra-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=sovra
      - POSTGRES_DB=sovra
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting decoupled stack}
    volumes:
      - sovra-pg-data:/var/lib/postgresql/data
    networks:
      - sovra-mesh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sovra -d sovra"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Cluster Nonce Replay, Distributed Rate Limiting & Cache Pub/Sub
  redis:
    image: redis:7-alpine
    container_name: sovra-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD before starting decoupled stack}"]
    volumes:
      - sovra-redis-data:/data
    networks:
      - sovra-mesh
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD:?Set REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 3. Sovereign Chain L1 Validator Cluster Nodes
  validator-0:
    build:
      context: ..
      dockerfile: docker/Dockerfile.validator
    container_name: sovra-validator-0
    ports:
      - "26656:26656"
      - "26657:26657"
      - "26660:26660"
    environment:
      - NODE_MONIKER=validator-0
      - CHAIN_ID=sovra-mainnet-1
      - VALIDATOR_INDEX=0
      - SOVRA_KMS_SIGNER_ADDR=${SOVRA_KMS_SIGNER_ADDR:-}
    volumes:
      - sovra-val0-data:/root/.sovrad
    networks:
      - sovra-mesh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:26657/status"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 4. Horizontal Stateless Core API Service
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - HOST=0.0.0.0
      - NODE_ENV=production
      - SOVRA_L1_RPC_URLS=http://validator-0:26657
      - DATABASE_URL=postgresql://sovra:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/sovra
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379
      - SOVRA_INTERNAL_SERVICE_SECRET=${SOVRA_INTERNAL_SERVICE_SECRET:?Set SOVRA_INTERNAL_SERVICE_SECRET}
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY:?Set ADMIN_SECRET_KEY}
      - FIAT_PAYOUT_PROVIDER_ENABLED=${FIAT_PAYOUT_PROVIDER_ENABLED:-false}
      - FIAT_PAYOUT_PROVIDER=${FIAT_PAYOUT_PROVIDER:-razorpayx}
      - MODERATION_WORKER_URL=http://moderation-worker:3021
      - SEARCH_WORKER_URL=http://search-worker:3022
      - TRANSCODER_WORKER_URL=http://transcoder-worker:3023
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      validator-0:
        condition: service_healthy
    networks:
      - sovra-mesh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health/liveness"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 5. Distributed AI Content Moderation Worker
  moderation-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    command: ["node", "services/moderation-worker/dist/server.js"]
    environment:
      - NODE_ENV=production
      - PORT=3021
      - HOST=0.0.0.0
      - SOVRA_INTERNAL_SERVICE_SECRET=${SOVRA_INTERNAL_SERVICE_SECRET:?Set SOVRA_INTERNAL_SERVICE_SECRET}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - sovra-mesh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3021/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  # 6. Full-Text & Vector Search Indexing Worker
  search-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    command: ["node", "services/search/dist/server.js"]
    environment:
      - NODE_ENV=production
      - PORT=3022
      - HOST=0.0.0.0
      - SOVRA_INTERNAL_SERVICE_SECRET=${SOVRA_INTERNAL_SERVICE_SECRET:?Set SOVRA_INTERNAL_SERVICE_SECRET}
      - DATABASE_URL=postgresql://sovra:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/sovra
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sovra-mesh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3022/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  # 7. Media HLS ABR Transcoding Worker
  transcoder-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    command: ["node", "services/transcoder/dist/server.js"]
    environment:
      - NODE_ENV=production
      - PORT=3023
      - HOST=0.0.0.0
      - SOVRA_INTERNAL_SERVICE_SECRET=${SOVRA_INTERNAL_SERVICE_SECRET:?Set SOVRA_INTERNAL_SERVICE_SECRET}
    networks:
      - sovra-mesh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3023/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  # 8. Edge API Gateway & Static CDN Router (NGINX)
  gateway:
    image: nginx:alpine
    container_name: sovra-edge-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - sovra-mesh

  # 9. Decentralized Storage Node Sidecar
  storage-node:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    command: ["node", "nodes/storage-node/dist/index.js"]
    environment:
      - NODE_ENV=production
      - PORT=3010
      - SOVRA_INTERNAL_SERVICE_SECRET=${SOVRA_INTERNAL_SERVICE_SECRET:?Set SOVRA_INTERNAL_SERVICE_SECRET}
      - DATABASE_URL=postgresql://sovra:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/sovra
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sovra-mesh
