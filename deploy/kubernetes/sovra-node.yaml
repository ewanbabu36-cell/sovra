apiVersion: v1
kind: Namespace
metadata:
  name: sovra-system
  labels:
    app.kubernetes.io/part-of: sovra-platform
---
# NOTE: Create `sovra-enterprise-secrets` via ExternalSecrets / Vault prior to applying:
# keys required: admin-secret-key, internal-service-secret, database-url, redis-url, turn-secret
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sovra-api
  namespace: sovra-system
  labels:
    app.kubernetes.io/name: sovra-api
    app.kubernetes.io/part-of: sovra-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sovra-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sovra-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "3001"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: sovra-api
          image: ghcr.io/sovra-network/sovra-api:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3001"
            - name: SOVRA_L1_RPC_URLS
              value: "http://sovra-validators-0.sovra-validators:26657,http://sovra-validators-1.sovra-validators:26657,http://sovra-validators-2.sovra-validators:26657,http://sovra-validators-3.sovra-validators:26657"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sovra-enterprise-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: sovra-enterprise-secrets
                  key: redis-url
            - name: ADMIN_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: sovra-enterprise-secrets
                  key: admin-secret-key
            - name: SOVRA_INTERNAL_SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: sovra-enterprise-secrets
                  key: internal-service-secret
            - name: SOVRA_TURN_SECRET
              valueFrom:
                secretKeyRef:
                  name: sovra-enterprise-secrets
                  key: turn-secret
          volumeMounts:
            - name: tmp-scratch
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /livez
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
      volumes:
        - name: tmp-scratch
          emptyDir: {}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sovra-api-hpa
  namespace: sovra-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sovra-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: v1
kind: Service
metadata:
  name: sovra-api-service
  namespace: sovra-system
  labels:
    app.kubernetes.io/name: sovra-api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "3001"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sovra-api
  ports:
    - name: http
      port: 80
      targetPort: 3001
---
apiVersion: v1
kind: Service
metadata:
  name: sovra-validators
  namespace: sovra-system
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: sovra-validator
  ports:
    - name: p2p
      port: 26656
      targetPort: 26656
    - name: rpc
      port: 26657
      targetPort: 26657
    - name: metrics
      port: 26660
      targetPort: 26660
---
apiVersion: v1
kind: Service
metadata:
  name: sovra-p2p-mesh
  namespace: sovra-system
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: sovra-validator
  ports:
    - name: p2p-mesh
      port: 26656
      targetPort: 26656
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sovra-validators
  namespace: sovra-system
spec:
  serviceName: sovra-validators
  replicas: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: sovra-validator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sovra-validator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "26660"
    spec:
      containers:
        - name: sovrad
          image: ghcr.io/sovra-network/sovrad:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: p2p
              containerPort: 26656
            - name: rpc
              containerPort: 26657
            - name: metrics
              containerPort: 26660
          env:
            - name: SOVRA_VALIDATOR_HOME
              value: "/var/lib/sovra-chain"
            - name: TMKMS_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: sovra-kms-config
                  key: tmkms-laddr
                  optional: true
          volumeMounts:
            - name: validator-data
              mountPath: /var/lib/sovra-chain
          livenessProbe:
            httpGet:
              path: /health
              port: 26657
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /status
              port: 26657
            initialDelaySeconds: 10
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: validator-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sovra-api-ingress
  namespace: sovra-system
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "sovra-api-service"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app.sovra.network
        - api.sovra.network
      secretName: sovra-tls-cert
  rules:
    - host: app.sovra.network
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sovra-api-service
                port:
                  number: 80
