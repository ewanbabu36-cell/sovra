apiVersion: v1
kind: ConfigMap
metadata:
  name: sovra-coturn-config
  namespace: sovra-system
  labels:
    app.kubernetes.io/name: sovra-coturn
    app.kubernetes.io/part-of: sovra-platform
data:
  turnserver.conf: |
    listening-port=3478
    tls-listening-port=5349
    min-port=49152
    max-port=49200
    fingerprint
    lt-cred-mech
    realm=sovra.network
    use-auth-secret
    stale-nonce=600
    bps-capacity=0
    max-bps=3000000
    total-quota=200
    user-quota=10
    no-loopback-peers
    no-multicast-peers
    denied-peer-ip=10.0.0.0-10.255.255.255
    denied-peer-ip=172.16.0.0-172.31.255.255
    denied-peer-ip=192.168.0.0-192.168.255.255
    denied-peer-ip=127.0.0.0-127.255.255.255
    cipher-list="ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"
    verbose
    no-cli
    log-file=stdout
---
apiVersion: v1
kind: Secret
metadata:
  name: sovra-coturn-secret
  namespace: sovra-system
type: Opaque
stringData:
  static-auth-secret: "sovra-prod-turn-secret-change-before-apply"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sovra-coturn
  namespace: sovra-system
  labels:
    app.kubernetes.io/name: sovra-coturn
    app.kubernetes.io/part-of: sovra-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sovra-coturn
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sovra-coturn
    spec:
      containers:
        - name: coturn
          image: coturn/coturn:4.6.2-alpine
          imagePullPolicy: IfNotPresent
          command: ["turnserver", "-c", "/etc/coturn/turnserver.conf"]
          env:
            - name: TURN_PORT
              value: "3478"
            - name: TURN_PORT_TLS
              value: "5349"
            - name: STATIC_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: sovra-coturn-secret
                  key: static-auth-secret
          ports:
            - name: turn-udp
              containerPort: 3478
              protocol: UDP
            - name: turn-tcp
              containerPort: 3478
              protocol: TCP
            - name: turn-tls-udp
              containerPort: 5349
              protocol: UDP
            - name: turn-tls-tcp
              containerPort: 5349
              protocol: TCP
          volumeMounts:
            - name: config-volume
              mountPath: /etc/coturn/turnserver.conf
              subPath: turnserver.conf
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      volumes:
        - name: config-volume
          configMap:
            name: sovra-coturn-config
---
apiVersion: v1
kind: Service
metadata:
  name: sovra-coturn-relay
  namespace: sovra-system
  labels:
    app.kubernetes.io/name: sovra-coturn
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: sovra-coturn
  ports:
    - name: turn-udp
      port: 3478
      targetPort: 3478
      protocol: UDP
    - name: turn-tcp
      port: 3478
      targetPort: 3478
      protocol: TCP
    - name: turn-tls-udp
      port: 5349
      targetPort: 5349
      protocol: UDP
    - name: turn-tls-tcp
      port: 5349
      targetPort: 5349
      protocol: TCP
