# ============================================================
#   SOVRA PRODUCTION COTURN STUN/TURN RELAY CONFIGURATION
#   Supports WebRTC NAT/CGNAT Traversal + TURNS TLS (Port 5349)
# ============================================================

listening-port=3478
tls-listening-port=5349
alt-listening-port=443
min-port=49152
max-port=49200

fingerprint
lt-cred-mech
realm=sovra.network
server-name=turn.sovra.network

# Ephemeral RFC 5766 HMAC-SHA1 Authentication
# Must be supplied via --static-auth-secret="${SOVRA_TURN_SECRET}" at runtime (zero plaintext secrets in config)
use-auth-secret
stale-nonce=600

# TLS Certificates for TURNS (Port 5349 & 443 TCP)
# Provisioned via Let's Encrypt Certbot + deploy/coturn/renew-hook.sh
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem
cipher-list="ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"
no-tlsv1
no-tlsv1_1

# SSRF & Internal Network Abuse Protection
no-loopback-peers
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255

# Bandwidth Quotas
bps-capacity=0
max-bps=3000000
total-quota=500
user-quota=15

no-cli
log-file=stdout
